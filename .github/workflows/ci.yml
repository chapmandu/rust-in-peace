name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history — gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      # Installs the toolchain pinned in mise.toml (python, node, uv, just, gitleaks).
      - uses: jdx/mise-action@v4.3.0
      - run: uv sync
      - run: npm ci
      - run: just check
      - run: uv run python -m scripts.build
      - run: uv run python -m scripts.build_ports
      # Fail if the committed downstream themes or generated README sections
      # are stale relative to the palette/YAML sources. The PNGs in
      # assets/generated/ are excluded: they rasterize with system fonts, so
      # bytes differ across machines.
      - run: git diff --exit-code ports/ README.md
