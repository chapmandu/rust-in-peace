name: Create Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
      - run: npm ci && mkdir -p ./bin
      - run: uv sync
      - run: npm run package
      - run: gh release create "${{ github.ref_name }}" --draft ./bin/rust-in-peace.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
